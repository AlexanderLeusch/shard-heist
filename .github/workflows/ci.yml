# ### CI: every push and pull request runs all tests (both rooms in JavaScript, the Python Plot Twist project). On main, the site is published to GitHub Pages only if they pass.
# ### Actions are pinned to full commit hashes (the version is in the comment), so a moved tag cannot change what runs.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Rules, story, input and page tests
        run: npm test
      - name: Library integrity (SRI) check
        run: npm run test:sri
      - name: Browser tests (headless Chrome)
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  plot-twist:
    # The original Plot Twist project (Python/Streamlit) in plot-twist/: its pytest checks and a dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plot-twist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - name: Python tests (exact versions from uv.lock)
        run: uv run --frozen pytest -q
      - name: Dependency audit (known vulnerabilities)
        run: |
          uv export --frozen --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

  deploy:
    needs: [test, plot-twist]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the files the game needs
        run: mkdir _site && cp -r index.html styles.css src fonts escape-room _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
